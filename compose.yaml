services:
  backend:
    build:
      context: ./attendance/attendance
    container_name: attendance-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/attendance_db
      SPRING_DATASOURCE_USERNAME: attendance_user
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - attendance-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:8081
    container_name: attendance-frontend
    ports:
      - "5173:80"
    networks:
      - attendance-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  attendance-network:
    external: true
    name: attendance-network
